<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3131">
<title>Pédagogie · Easy Auto-École</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Couleurs et polices (mêmes que Mes outils / Places Permis) ============ */
:root{
  --easy:#ff3131; --easy-dark:#e01f1f; --easy-light:#fff0f0;
  --grad-easy:linear-gradient(135deg,#ff4040 0%,#ff3131 55%,#ec1f1f 100%);
  --bg:#f7f6f5; --surface:#ffffff; --text:#1c2430; --text-muted:#6b7280; --text-light:#9ca3af;
  --border:#ebe9e7;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --police-titre:'Fredoka','DM Sans',sans-serif;
  --police-texte:'DM Sans','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
body.dark{
  --bg:#0f1117; --surface:#1a1d27; --text:#e8eaf0; --text-muted:#8b92a8; --text-light:#5a6178;
  --border:#2a2f40; --easy-light:#3a0d0d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--police-texte);background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;
  transition:background .3s var(--ease),color .3s var(--ease)}

/* ============ En-tête ============ */
.haut{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--grad-easy);color:#fff;box-shadow:0 2px 10px rgba(255,49,49,.25)}
.retour{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;
  padding:6px 10px 6px 6px;border-radius:10px}
.retour:hover{background:rgba(255,255,255,.15)}
.retour svg{width:18px;height:18px}
.haut .t{font-family:var(--police-titre);font-weight:600;font-size:18px}
.theme-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:17px;height:17px}

/* ============ Page ============ */
main{max-width:820px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:var(--police-titre);font-weight:600;font-size:clamp(26px,5vw,34px);letter-spacing:-.4px}
.intro{color:var(--text-muted);font-size:15px;margin:4px 0 22px}

/* Lien vers le livret de séance */
.livret{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 16px;margin:-6px 0 20px;text-decoration:none;color:inherit;transition:transform .2s var(--ease),border-color .2s var(--ease)}
.livret:hover{transform:translateY(-2px);border-color:var(--easy)}
.livret-i{flex:none;width:44px;height:44px;border-radius:13px;background:var(--grad-easy);color:#fff;display:grid;place-items:center}
.livret-i svg{width:22px;height:22px}
.livret b{display:block;font-family:var(--police-titre);font-weight:600;font-size:17px}
.livret small{display:block;font-size:13px;color:var(--text-muted);margin-top:1px}
.livret-f{flex:none;margin-left:auto;width:18px;height:18px;color:var(--text-light)}

/* Onglets des compétences */
.onglets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.onglet{font-family:var(--police-titre);font-weight:600;font-size:15px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);padding:8px 16px;border-radius:12px;cursor:pointer}
.onglet.on{background:var(--easy);border-color:var(--easy);color:#fff}
.onglet:disabled{cursor:default;border-style:dashed;background:transparent;color:var(--text-light)}

/* Compétence */
.comp{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.comp-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border)}
.badge{flex:none;width:52px;height:52px;border-radius:15px;background:var(--grad-easy);color:#fff;display:grid;place-items:center;
  font-family:var(--police-titre);font-weight:600;font-size:20px;box-shadow:0 4px 12px rgba(255,49,49,.28)}
.comp-h h2{font-family:var(--police-titre);font-weight:600;font-size:20px;line-height:1.2}
.comp-h p{font-size:13px;color:var(--text-muted);margin-top:2px}
.outils{margin-left:auto;display:flex;gap:6px}
.outils button{font-family:inherit;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.outils button:hover{color:var(--easy);border-color:var(--easy)}

/* Étapes */
.etape{border-top:1px solid var(--border)}
.etape:first-child{border-top:none}
.etape summary{list-style:none;display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;user-select:none}
.etape summary::-webkit-details-marker{display:none}
.etape summary:hover{background:var(--bg)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--easy-light);color:var(--easy);display:grid;place-items:center;
  font-family:var(--police-titre);font-weight:600;font-size:14px}
.etape-t{font-weight:700;font-size:15.5px;flex:1}
.chev{flex:none;width:18px;height:18px;color:var(--text-light);transition:transform .2s var(--ease)}
.etape[open] .chev{transform:rotate(180deg)}
.etape[open] summary{background:var(--bg)}
.etape.cible{box-shadow:inset 4px 0 0 var(--easy)}
.etape-c{padding:4px 20px 18px 64px;font-size:15px;line-height:1.65}
.etape-c ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.etape-c li{position:relative;padding-left:16px}
.etape-c li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--easy)}
.cle{font-weight:700;color:var(--easy)}

/* Points d'attention & astuces */
.notes{border-top:1px solid var(--border);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.alerte{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;padding:11px 14px;border-radius:12px;
  background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
body.dark .alerte{background:#2d1a08;color:#fdba74;border-color:#5a3412}
.alerte svg{flex:none;width:18px;height:18px;margin-top:1px}
.astuces{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.astuce{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border)}
.astuce svg{flex:none;width:16px;height:16px;color:#d97706;margin-top:1px}
.pied{text-align:center;padding:26px 16px 30px;font-size:12px;color:var(--text-light)}
.pied a{color:var(--text-muted);text-decoration:none}
.pied a:hover{color:var(--easy)}

@media(max-width:560px){
  .comp-h{flex-wrap:wrap;padding:16px}
  .outils{margin-left:66px}
  .etape summary{padding:14px 16px}
  .etape-c{padding:2px 16px 16px 16px}
}
@media print{
  .haut,.onglets,.outils,.pied{display:none}
  body{background:#fff}
  .comp{box-shadow:none}
  .etape-c{display:block!important}
}
</style>
</head>
<body>
<header class="haut">
  <a class="retour" href="https://easycds.github.io/" title="Retour à Mes outils">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Mes outils
  </a>
  <span class="t">Pédagogie</span>
  <button class="theme-btn" id="theme" type="button" aria-label="Changer de thème"></button>
</header>

<main>
  <h1>Trame pédagogique</h1>
  <p class="intro">Le déroulé des leçons, compétence par compétence. Clique sur une étape pour la déplier.</p>
  <a class="livret" href="livret.html">
    <span class="livret-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
    <span><b>Livret de séance</b><small>Fin de leçon : clique sur ce qui a été travaillé, puis copie le texte dans le livret</small></span>
    <svg class="livret-f" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <div class="onglets" id="onglets"></div>
  <div id="contenu"></div>
</main>

<p class="pied">Easy Auto-École · <a href="https://easycds.github.io/">Mes outils</a></p>

<script src="trame.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fort = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="cle">$1</span>');
const ALERTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></svg>';
const AMPOULE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>';
const CHEV ='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

// Lien direct : #c3 ouvre la C3, #c2-13 ouvre la C2 à l'étape 13 (utilisé par le livret de séance)
let actif = COMPETENCES[0].code, etapeCible = 0;
try { const m = location.hash.slice(1).toUpperCase().match(/^(C\d)(?:-(\d+))?$/);
  if (m && COMPETENCES.some(c => c.code === m[1] && c.etapes.length)) { actif = m[1]; etapeCible = +(m[2]||0); } } catch(e){}

function afficher(){
  document.getElementById('onglets').innerHTML = COMPETENCES.map(c =>
    `<button class="onglet${c.code===actif?' on':''}" ${c.etapes.length?`onclick="choisir('${c.code}')"`:'disabled title="Bientôt"'}>${c.code}</button>`).join('');
  const c = COMPETENCES.find(x => x.code === actif);
  document.getElementById('contenu').innerHTML =
    `<section class="comp"><div class="comp-h"><div class="badge">${c.code}</div><div><h2>${esc(c.titre)}</h2>${c.sousTitre?`<p>${esc(c.sousTitre)}</p>`:''}</div>`+
    `<div class="outils"><button onclick="toutOuvrir(true)">Tout déplier</button><button onclick="toutOuvrir(false)">Tout replier</button></div></div>`+
    c.etapes.map((e,i) => `<details class="etape"><summary><span class="num">${i+1}</span><span class="etape-t">${esc(e.titre)}</span>${CHEV}</summary>`+
      `<div class="etape-c"><ul>${e.points.map(p=>`<li>${fort(p)}</li>`).join('')}</ul></div></details>`).join('')+
    ((c.alertes||[]).length||(c.astuces||[]).length ? `<div class="notes">`+
      (c.alertes||[]).map(a=>`<div class="alerte">${ALERTE}<span>${fort(a)}</span></div>`).join('')+
      ((c.astuces||[]).length ? `<div class="astuces">${c.astuces.map(a=>`<div class="astuce">${AMPOULE}<span>${fort(a)}</span></div>`).join('')}</div>` : '')+
    `</div>` : '')+
    `</section>`;
}
function choisir(code){ actif = code; try{ history.replaceState(null,'','#'+code.toLowerCase()); }catch(e){} afficher(); }
function toutOuvrir(o){ document.querySelectorAll('.etape').forEach(d => d.open = o); }
afficher();
if (etapeCible) { const d = document.querySelectorAll('.etape')[etapeCible-1];
  if (d) { d.open = true; d.classList.add('cible'); setTimeout(() => d.scrollIntoView({ block:'center' }), 60); } }

/* Thème : clair par défaut, sombre au choix (même réglage que Mes outils) */
const btn = document.getElementById('theme');
const SOLEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const LUNE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
function appliquer(s){ document.body.classList.toggle('dark', s); btn.innerHTML = s ? SOLEIL : LUNE; }
let choix = null; try { choix = localStorage.getItem('easy-hub-theme'); } catch(e){}
let sombre = choix === 'dark';
appliquer(sombre);
btn.addEventListener('click', () => { sombre = !sombre; appliquer(sombre); choix = sombre ? 'dark' : 'light'; try { localStorage.setItem('easy-hub-theme', choix); } catch(e){} });
</script>
</body>
</html>
