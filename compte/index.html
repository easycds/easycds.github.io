<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3131">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Ton compte · Easy Auto-école</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/fonts/polices.css">
<style>
/* Page d'action des e-mails de compte (Firebase Auth) : confirmation d'adresse, nouveau mot de passe, annulation d'un changement d'adresse.
   À régler dans la console Firebase › Authentication › Modèles › « URL d'action » : https://easycds.fr/compte/ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--easy:#ff3131;--easy-fonce:#e01f1f;--rose:#ffe4e4;--texte:#000;--gris:#4a515c;--fond:#f1f0ef;--bord:#dcd9d5;--ok:#1e7f45;--ok-clair:#e6f6ec}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:var(--fond);color:var(--texte);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.barre{background:#fff;border-bottom:1px solid #e8e6e3}
.barre div{max-width:560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--texte)}
.logo b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:34px;line-height:1;color:var(--easy)}
.logo span{font-weight:700;font-size:15px}
main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:36px 20px 48px}
.carte{background:#fff;border-radius:28px;padding:28px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
.ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin-bottom:16px;background:var(--rose)}
.ico svg{width:30px;height:30px;fill:none;stroke:var(--easy-fonce);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ico.ok{background:var(--ok-clair)}.ico.ok svg{stroke:var(--ok)}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(26px,6vw,34px);line-height:1.15;text-wrap:balance}
p{margin-top:10px;color:var(--gris);font-size:16.5px}
p b{color:var(--texte)}
form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
input{font:inherit;font-weight:400;width:100%;height:50px;border-radius:14px;border:1.5px solid var(--bord);padding:0 14px;font-size:16px}
input:focus{outline:none;border-color:var(--easy-fonce);box-shadow:0 0 0 4px rgba(224,31,31,.12)}
.btn{display:flex;align-items:center;justify-content:center;margin-top:20px;width:100%;height:56px;border-radius:16px;border:0;background:var(--easy);color:#fff;font:600 17px Fredoka,'DM Sans',sans-serif;text-decoration:none;cursor:pointer}
.btn[disabled]{opacity:.6}
.lien{display:block;text-align:center;margin-top:14px;color:var(--gris);font-weight:600;font-size:14px}
.err{margin-top:12px;color:#a81616;font-weight:600;min-height:1.4em}
.pied{text-align:center;padding:20px;font-size:13px;color:var(--gris)}
.pied a{color:inherit}
/* logo, icônes, titres et textes centrés (validé par la direction le 6/11/2026) ; les champs restent alignés à gauche */
.barre div{justify-content:center}
.carte{text-align:center}
.ico{margin-left:auto;margin-right:auto}
form{text-align:left}
</style>
</head>
<body>
<div class="barre"><div><a class="logo" href="/"><b>easy</b><span>Auto-école</span></a></div></div>
<main><div class="carte" id="carte">
  <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
  <h1>Un instant…</h1><p>On vérifie ton lien.</p>
</div></main>
<div class="pied">Easy Auto-école Saint-Sylvain · <a href="/mentions-legales.html">Mentions légales</a></div>
<script>
(function () {
  var CONF = { apiKey: 'AIzaSyBTlHPr02V0yTyyksUdQJhMgwwMBhns_9E', authDomain: 'easy-cds.firebaseapp.com', projectId: 'easy-cds' }, SDK = 'https://www.gstatic.com/firebasejs/13.1.0/';
  var q = new URLSearchParams(location.search), mode = q.get('mode'), code = q.get('oobCode'), suite = q.get('continueUrl') || '/outils/';
  try { var u = new URL(suite, location.origin); suite = u.origin === location.origin ? u.pathname + u.search + u.hash : '/outils/'; } catch (e) { suite = '/outils/'; }   // on ne renvoie que vers easycds.fr
  var carte = document.getElementById('carte');
  function echap(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var ICO = { ok: '<div class="ico ok"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>', mail: '<div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>', cle: '<div class="ico"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12 21 2M17 6l3 3M15 8l3 3"/></svg></div>', non: '<div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>' };
  function montrer(ico, titre, texte, bouton, lien) { carte.innerHTML = ICO[ico] + '<h1>' + titre + '</h1><p>' + texte + '</p>' + (bouton || '') + (lien || ''); }
  function script(src) { return new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
  function msg(x) {
    var c = (x && x.code) || '';
    if (/expired-action-code/.test(c)) return 'Ce lien a expiré. Retourne sur la page de connexion et demande un nouvel e-mail.';
    if (/invalid-action-code/.test(c)) return 'Ce lien a déjà été utilisé ou n’est plus valable. Si ton adresse est déjà confirmée, connecte-toi simplement.';
    if (/user-disabled|user-not-found/.test(c)) return 'Ce compte n’existe plus ou est désactivé.';
    if (/weak-password/.test(c)) return 'Mot de passe trop court : 8 caractères minimum.';
    if (/network/.test(c)) return 'Pas de réseau : réessaie dans un instant.';
    return 'Ça n’a pas fonctionné. Retourne sur la page de connexion et demande un nouvel e-mail.';
  }
  var boutonSuite = '<a class="btn" href="' + echap(suite) + '">Ouvrir Mes outils</a>';
  var pasDeLien = function () { montrer('non', 'Ce lien est incomplet', 'Ouvre le lien directement depuis l’e-mail reçu d’Easy Auto-école.', '<a class="btn" href="/outils/">Aller à la connexion</a>'); };
  if (!mode || !code) { pasDeLien(); return; }
  script(SDK + 'firebase-app-compat.js').then(function () { return script(SDK + 'firebase-auth-compat.js'); }).then(function () {
    var a = firebase.auth(firebase.initializeApp(CONF));
    if (mode === 'verifyEmail') {
      a.applyActionCode(code).then(function () {
        var u = a.currentUser; if (u) u.reload().catch(function () {});     // si la personne est déjà connectée sur cet appareil, son compte passe à « vérifié » tout de suite
        montrer('ok', 'Adresse confirmée !', 'Ton compte Easy est activé. Tu peux ouvrir <b>Mes outils</b> : pédagogie, cours, livret, simulateur.', boutonSuite);
      }).catch(function (x) { montrer('non', 'Lien non valable', msg(x), '<a class="btn" href="/outils/">Aller à la connexion</a>'); });
    } else if (mode === 'resetPassword') {
      a.verifyPasswordResetCode(code).then(function (mail) {
        montrer('cle', 'Nouveau mot de passe', 'Pour le compte <b>' + echap(mail) + '</b>. 8 caractères minimum.',
          '<form id="f"><label>Nouveau mot de passe<input type="password" id="m1" autocomplete="new-password" minlength="8" required></label><label>Encore une fois<input type="password" id="m2" autocomplete="new-password" minlength="8" required></label><button class="btn" type="submit">Enregistrer</button><div class="err" id="err" aria-live="polite"></div></form>');
        var f = document.getElementById('f');
        f.onsubmit = function (e) {
          e.preventDefault(); var m1 = document.getElementById('m1').value, m2 = document.getElementById('m2').value, err = document.getElementById('err');
          if (m1.length < 8) { err.textContent = '8 caractères minimum.'; return; } if (m1 !== m2) { err.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
          f.querySelector('.btn').disabled = true; err.textContent = '';
          a.confirmPasswordReset(code, m1).then(function () { montrer('ok', 'Mot de passe enregistré', 'Tu peux te connecter avec ton nouveau mot de passe.', boutonSuite); })
            .catch(function (x) { f.querySelector('.btn').disabled = false; err.textContent = msg(x); });
        };
      }).catch(function (x) { montrer('non', 'Lien non valable', msg(x), '<a class="btn" href="/outils/">Aller à la connexion</a>'); });
    } else if (mode === 'recoverEmail') {
      a.checkActionCode(code).then(function (info) { return a.applyActionCode(code).then(function () { return info; }); })
        .then(function (info) { var m = info && info.data && info.data.email; montrer('ok', 'Adresse rétablie', 'Ton compte utilise à nouveau <b>' + echap(m || 'ton ancienne adresse') + '</b>. Si tu n’es pas à l’origine de ce changement, pense à modifier ton mot de passe.', boutonSuite); })
        .catch(function (x) { montrer('non', 'Lien non valable', msg(x), '<a class="btn" href="/outils/">Aller à la connexion</a>'); });
    } else pasDeLien();
  }).catch(function () { montrer('non', 'Pas de réseau', 'Impossible de vérifier le lien pour l’instant. Réessaie dans un instant.', '<a class="btn" href="">Réessayer</a>'); });
})();
</script>
</body>
</html>
