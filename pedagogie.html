<!DOCTYPE html>
<html lang="fr">
<head>
<script src="/acces.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/pedagogie-apple-touch.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3131">
<meta name="robots" content="noindex, nofollow">
<title>Pédagogie · Easy Auto-École</title>
<link rel="manifest" href="/pedagogie.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pédagogie">
<link rel="stylesheet" href="/fonts/polices.css">
<style>
/* ============ Couleurs et polices (mêmes que Mes outils / Places Permis) ============ */
:root{
  --easy:#ff3131; --easy-dark:#e01f1f; --easy-light:#fff0f0;
  --grad-easy:linear-gradient(135deg,#ff4040 0%,#ff3131 55%,#ec1f1f 100%);
  --bg:#f7f6f5; --surface:#ffffff; --text:#1c2430; --text-muted:#6b7280; --text-light:#9ca3af;
  --border:#ebe9e7;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --police-titre:'Fredoka','DM Sans',sans-serif;
  --police-texte:'DM Sans','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
body.dark{
  --bg:#0f1117; --surface:#1a1d27; --text:#e8eaf0; --text-muted:#8b92a8; --text-light:#5a6178;
  --border:#2a2f40; --easy-light:#3a0d0d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--police-texte);background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;
  transition:background .3s var(--ease),color .3s var(--ease)}

/* ============ En-tête ============ */
.haut{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--grad-easy);color:#fff;box-shadow:0 2px 10px rgba(255,49,49,.25)}
.retour{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;
  padding:6px 10px 6px 6px;border-radius:10px}
.retour:hover{background:rgba(255,255,255,.15)}
.retour svg{width:18px;height:18px}
.haut .t{font-family:var(--police-titre);font-weight:600;font-size:18px}
.theme-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:17px;height:17px}

/* ============ Page ============ */
main{max-width:820px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:var(--police-titre);font-weight:600;font-size:clamp(26px,5vw,34px);letter-spacing:-.4px}
.intro{color:var(--text-muted);font-size:15px;margin:4px 0 22px}

/* Lien vers le livret de séance */
.livret{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 16px;margin:-6px 0 20px;text-decoration:none;color:inherit;transition:transform .2s var(--ease),border-color .2s var(--ease)}
.livret:hover{transform:translateY(-2px);border-color:var(--easy)}
.livret-i{flex:none;width:44px;height:44px;border-radius:13px;background:var(--grad-easy);color:#fff;display:grid;place-items:center}
.livret-i svg{width:22px;height:22px}
.livret b{display:block;font-family:var(--police-titre);font-weight:600;font-size:17px}
.livret small{display:block;font-size:13px;color:var(--text-muted);margin-top:1px}
.livret-f{flex:none;margin-left:auto;width:18px;height:18px;color:var(--text-light)}

/* Onglets des compétences */
.onglets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.onglet{font-family:var(--police-titre);font-weight:600;font-size:15px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-muted);padding:8px 16px;border-radius:12px;cursor:pointer}
.onglet.on{background:var(--easy);border-color:var(--easy);color:#fff}
.onglet:disabled{cursor:default;border-style:dashed;background:transparent;color:var(--text-light)}

/* Compétence */
.comp{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.comp-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border)}
.badge{flex:none;width:52px;height:52px;border-radius:15px;background:var(--grad-easy);color:#fff;display:grid;place-items:center;
  font-family:var(--police-titre);font-weight:600;font-size:20px;box-shadow:0 4px 12px rgba(255,49,49,.28)}
.comp-h h2{font-family:var(--police-titre);font-weight:600;font-size:20px;line-height:1.2}
.comp-h p{font-size:13px;color:var(--text-muted);margin-top:2px}
.outils{margin-left:auto;display:flex;gap:6px}
.outils button{font-family:inherit;font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.outils button:hover{color:var(--easy);border-color:var(--easy)}

/* Étapes */
.etape{border-top:1px solid var(--border)}
.etape:first-child{border-top:none}
.etape summary{list-style:none;display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;user-select:none}
.etape summary::-webkit-details-marker{display:none}
.etape summary:hover{background:var(--bg)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--easy-light);color:var(--easy);display:grid;place-items:center;
  font-family:var(--police-titre);font-weight:600;font-size:14px}
.etape-t{font-weight:700;font-size:15.5px;flex:1}
.chev{flex:none;width:18px;height:18px;color:var(--text-light);transition:transform .2s var(--ease)}
.etape[open] .chev{transform:rotate(180deg)}
.etape[open] summary{background:var(--bg)}
.etape.cible{box-shadow:inset 4px 0 0 var(--easy)}
.etape-c{padding:4px 20px 18px 64px;font-size:15px;line-height:1.65}
.etape-c ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.etape-c li{position:relative;padding-left:16px}
.simu-liens{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.simu-liens span{width:100%;font-size:13px;font-weight:700;color:var(--text-muted)}
.simu-liens a{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--easy-light);color:var(--easy-dark);font-weight:600;font-size:14px;text-decoration:none}
body.dark .simu-liens a{color:#ffb4ab}
@media print{.simu-liens{display:none}}
.etape-c li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--easy)}
.cle{font-weight:700;color:var(--easy)}

/* Points d'attention & astuces */
.notes{border-top:1px solid var(--border);padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.alerte{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;padding:11px 14px;border-radius:12px;
  background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
body.dark .alerte{background:#2d1a08;color:#fdba74;border-color:#5a3412}
.alerte svg{flex:none;width:18px;height:18px;margin-top:1px}
.astuces{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.astuce{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border)}
.astuce svg{flex:none;width:16px;height:16px;color:#d97706;margin-top:1px}
.pied{text-align:center;padding:26px 16px 30px;font-size:12px;color:var(--text-light)}
.pied a{color:var(--text-muted);text-decoration:none}
.pied a:hover{color:var(--easy)}

@media(max-width:560px){
  .comp-h{flex-wrap:wrap;padding:16px}
  .outils{margin-left:66px}
  .etape summary{padding:14px 16px}
  .etape-c{padding:2px 16px 16px 16px}
}
@media print{
  .haut,.onglets,.outils,.pied{display:none}
  body{background:#fff}
  .comp{box-shadow:none}
  .etape-c{display:block!important}
}

/* ============ Trame / Réglementation ============ */
.sections{display:flex;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:14px;width:fit-content;max-width:100%;flex-wrap:wrap;margin-bottom:22px}
.sections button{font-family:var(--police-titre);font-weight:600;font-size:15px;border:0;background:transparent;color:var(--text-muted);padding:10px 16px;min-height:44px;border-radius:10px;cursor:pointer}
.sections button.on{background:var(--easy-dark);color:#fff}
.r-onglets{display:flex;gap:4px;border-bottom:2px solid var(--border);flex-wrap:wrap;margin-bottom:22px}
.r-onglets button{font-family:var(--police-titre);font-weight:600;font-size:16px;padding:12px 14px;min-height:46px;margin-bottom:-2px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--text-muted);cursor:pointer}
.r-onglets button.on{border-bottom-color:var(--easy-dark);color:var(--text)}
.r-cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.r-cherche{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 14px;min-height:46px;margin-bottom:12px;color:var(--text-muted)}
.r-cherche input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--text);min-height:44px}
.r-filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.r-filtres button{font:inherit;font-size:14px;font-weight:600;padding:10px 14px;min-height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer}
.r-filtres button.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.r-carte{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.r-ligne{display:grid;grid-template-columns:minmax(0,1fr) 120px 170px 90px;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
.r-ligne:first-child{border-top:0}
.r-entete{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding-top:12px;padding-bottom:12px}
.r-ligne b{display:block;font-size:15.5px;line-height:1.35}
.r-ligne small{display:block;font-size:13px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.r-classe{font-size:13.5px;color:var(--text-muted)}
.r-montant b{font-size:17px}
.r-pts{justify-self:end;min-width:64px;text-align:center;padding:6px 10px;border-radius:10px;font-weight:700;font-size:14px}
.p0{background:var(--bg);color:var(--text-muted)}.p1{background:#fff1d6;color:#7a4a00}.p2{background:#ffe0dc;color:#a3160f}.p3{background:#a3160f;color:#fff}
body.dark .p1{background:#3a2a08;color:#fcd38a}body.dark .p2{background:#3d1210;color:#ffb4ab}
.r-vide{padding:20px;color:var(--text-muted)}
.r-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.r-grille-haut{margin:0 0 14px}
.r-bloc{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 20px;margin-bottom:14px}
.r-grille .r-bloc{margin-bottom:0}
.r-bloc h2{font-family:var(--police-titre);font-weight:600;font-size:19px;margin-bottom:10px}
.r-bloc p{font-size:14.5px;line-height:1.55;margin-top:8px}
.r-bloc p:first-of-type{margin-top:0}
.r-bloc table{width:100%;border-collapse:collapse;font-size:14px}
.r-bloc th,.r-bloc td{padding:8px 4px;border-top:1px solid var(--border);text-align:right;font-weight:400}
.r-bloc thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700}
.r-bloc th:first-child{text-align:left;font-weight:600}
.r-bloc .r-petit{font-size:13px;color:var(--text-muted);margin-top:10px}
.r-orange{background:#fff7ed;border-color:#fed7aa;color:#7c2d12}body.dark .r-orange{background:#2d1a08;border-color:#5a3412;color:#fdba74}
.r-sombre{background:#1c2430;border-color:#1c2430;color:#e6e8ec}.r-sombre h2{color:#fff}body.dark .r-sombre{background:#2a2f40;border-color:#2a2f40}
.r-source{font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-top:20px}
.r-permis{display:inline-flex;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;flex-wrap:wrap}
.r-permis button{font:inherit;font-weight:700;font-size:14.5px;padding:10px 16px;min-height:44px;border-radius:10px;border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.r-permis button.on{background:var(--text);color:var(--bg)}
.r-simu{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.r-liste{padding:8px}
.r-coche{width:100%;display:flex;align-items:center;gap:12px;padding:12px;min-height:48px;border:0;border-radius:12px;background:transparent;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.r-coche .cc{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--text-light);display:grid;place-items:center;box-sizing:border-box}
.r-coche .nm{flex:1;font-size:15px}.r-coche .pt{font-weight:600;font-size:14px;color:var(--text-muted)}
.r-coche.on{background:var(--easy-light)}.r-coche.on .cc{background:var(--easy-dark);border-color:var(--easy-dark)}.r-coche.on .nm{font-weight:600}.r-coche.on .pt{color:#a3160f}
body.dark .r-coche.on .pt{color:#ffb4ab}
.r-solde{padding:20px;display:flex;flex-direction:column;gap:16px}
.r-solde .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.r-solde .gros{font-family:var(--police-titre);font-weight:600;font-size:56px;line-height:1}
.r-solde .gros span{font-size:24px;color:var(--text-muted)}
.r-cases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.r-cases i{height:22px;border-radius:6px;background:var(--bg)}.r-cases i.pl{background:#2f9e6b}.r-cases i.pe{background:#ffe0dc;border:2px dashed #e01f1f}
body.dark .r-cases i.pe{background:#3d1210}
.r-meme{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.45;cursor:pointer}
.r-meme input{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--easy)}
.r-msg{padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.5}
.r-msg.al{background:#a3160f;color:#fff;font-weight:600}
.r-effacer{font:inherit;font-weight:600;font-size:14px;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer}
.r-table{overflow-x:auto}
.r-table table{width:100%;min-width:620px;border-collapse:collapse}
.r-table thead th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:14px 8px;text-align:center;font-weight:700}
.r-table thead th:first-child{text-align:left;padding-left:20px}
.r-table thead th.jc-t{color:#a3160f}body.dark .r-table thead th.jc-t{color:#ffb4ab}
.r-table tbody th{text-align:left;padding:14px 20px;font-weight:600;font-size:15px;line-height:1.35;border-top:1px solid var(--border)}
.r-table td{padding:10px 8px;border-top:1px solid var(--border)}
.r-table td.jc{background:var(--easy-light)}
.panneau{margin:0 auto;width:50px;height:50px;border-radius:50%;border:5px solid #e01f1f;background:#fff;color:#1c2430;display:grid;place-items:center;font-weight:700;font-size:17px;box-sizing:border-box}
.r-notes{margin-top:6px}.r-notes p{font-size:14.5px;line-height:1.55;color:var(--text-muted);margin-top:10px}.r-notes b{color:var(--text)}
.r-delai .n{display:block;font-family:var(--police-titre);font-weight:600;font-size:34px;line-height:1;margin-bottom:8px}
.r-delai b{display:block;font-size:15.5px;margin-bottom:4px}.r-delai .d,.r-stage .d{display:block;font-size:14px;color:var(--text-muted);line-height:1.5}
.c6{color:#2f7d55}.c2{color:#8a5a00}.c3{color:#a3160f}body.dark .c6{color:#6fd3a0}body.dark .c2{color:#fcd38a}body.dark .c3{color:#ffb4ab}
.r-stage{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.r-stage .n{font-family:var(--police-titre);font-weight:600;font-size:30px}.r-stage b{display:block;font-size:15.5px;margin-bottom:4px}.r-stage div{flex:1 1 320px}
.r-pro{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 16px;font-size:14.5px;line-height:1.5;margin-bottom:10px}
@media(max-width:720px){
.r-ligne{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
.r-ligne .r-classe,.r-entete{display:none}
.r-pts{grid-row:1 / span 2;grid-column:2}
.r-simu,.r-pro{grid-template-columns:minmax(0,1fr)}
}
@media print{.sections,.r-onglets,.r-filtres,.r-cherche,.r-effacer{display:none}}
.pied a{display:inline-block;padding:10px 4px}
</style>
</head>
<body>
<header class="haut">
  <a class="retour" href="/" title="Retour à Mes outils">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Mes outils
  </a>
  <span class="t">Pédagogie</span>
  <button class="theme-btn" id="theme" type="button" aria-label="Changer de thème"></button>
</header>

<main>
  <nav class="sections" id="sections" aria-label="Pédagogie">
    <button type="button" data-vue="trame" class="on" aria-pressed="true">Trame pédagogique</button>
    <button type="button" data-vue="regl" aria-pressed="false">Réglementation</button>
    <button type="button" data-vue="chiffres" aria-pressed="false">Chiffres</button>
  </nav>
  <div id="vue-trame">
  <h1>Trame pédagogique</h1>
  <p class="intro">Le déroulé des leçons, compétence par compétence. Clique sur une étape pour la déplier.</p>
  <a class="livret" href="livret.html">
    <span class="livret-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
    <span><b>Livret de séance</b><small>Fin de leçon : clique sur ce qui a été travaillé, puis copie le texte dans le livret</small></span>
    <svg class="livret-f" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <div class="onglets" id="onglets"></div>
  <div id="contenu"></div>
  </div>
  <div id="vue-regl" hidden></div>
  <div id="vue-chiffres" hidden></div>
</main>

<p class="pied">Easy Auto-École · <a href="/">Mes outils</a> · <a href="mentions-legales.html">Mentions légales</a></p>

<script src="trame.js"></script>
<script src="chiffres.js"></script>
<script src="reglementation.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fort = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="cle">$1</span>');
const ALERTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></svg>';
const AMPOULE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg>';
const CHEV ='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

// Lien direct : #c3 ouvre la C3, #c2-13 ouvre la C2 à l'étape 13 (utilisé par le livret de séance)
let actif = COMPETENCES[0].code, etapeCible = 0;
try { const m = location.hash.slice(1).toUpperCase().match(/^(C\d)(?:-(\d+))?$/);
  if (m && COMPETENCES.some(c => c.code === m[1] && c.etapes.length)) { actif = m[1]; etapeCible = +(m[2]||0); } } catch(e){}

const SIMU_LIENS = {"C1-3":[["cedez","Cédez-le-passage"],["stop","4 Stops"],["priorite_droite","Priorité à droite"],["exemple","Carrefours en ville"]],"C1-6":[["exemple","Carrefours en ville"],["arret_precis","Arrêt précis"]],"C1-7":[["demi_tour","Demi-tour en 3 étapes"]],"C2-3":[["briollay1","Briollay – feux"],["feux_classique","Feux · croisement classique"]],"C2-4":[["feux_classique","Croisement classique"],["feux_indo","À l’indonésienne"],["feux_camion","Face à un camion"],["sonnettes_vue","7 Sonnettes"],["dunant_vue","Henri Dunant × Copernic"]],"C2-5":[["giratoire","Giratoire"],["haricot","Giratoire en haricot"]],"C2-6":[["giratoire","Giratoire"],["giratoire_velo","Avec bande cyclable"]],"C2-7":[["giratoire","Giratoire"],["giratoire2","À deux voies"],["haricot_velo","Haricot avec bande cyclable"]],"C2-8":[["giratoire2","Giratoire à deux voies"]],"C2-9":[["sonnettes_vue","7 Sonnettes"],["dunant_vue","Henri Dunant × Copernic"]],"C2-10":[["parking","Parking"],["manoeuvres","Manœuvres"]],"C2-11":[["parking","Parking"],["manoeuvres","Manœuvres"]],"C2-12":[["parking","Parking"],["manoeuvres","Manœuvres"]],"C2-13":[["manoeuvres","Manœuvres"],["parking","Parking"]],"C2-14":[["manoeuvres","Manœuvres"],["parking","Parking"]],"C3-1":[["etroit","Passage étroit"],["rd_croiser","Se croiser sur route étroite"]],"C3-2":[["rd_croiser","Route étroite"],["rd_droite","Tourner à droite"],["rd_gauche","Tourner à gauche"]],"C3-3":[["arret_precis","Arrêt précis à un repère"]],"C3-4":[["rd_droite","Tourner à droite hors agglo"],["rd_gauche","Tourner à gauche hors agglo"]],"C3-5":[["autoroute","Voie d’insertion"]],"C3-6":[["sortie","Sortie (décélération)"]],"C3-7":[["autoroute","Voie d’insertion"]],"C3-9":[["depassement","Dépasser un cycliste (1,5 m)"],["depassement_ville","En ville (1 m)"]]}; // étape de la trame → scènes du simulateur
function liensSimu(code, n){ const L = SIMU_LIENS[code + '-' + n]; if (!L) return ''; return '<div class="simu-liens"><span>Voir dans le simulateur</span>' + L.map(function (x) { return '<a href="/simu/#' + x[0] + '" target="_blank" rel="noopener">' + esc(x[1]) + ' ↗</a>'; }).join('') + '</div>'; }
function afficher(){
  document.getElementById('onglets').innerHTML = COMPETENCES.map(c =>
    `<button class="onglet${c.code===actif?' on':''}" ${c.etapes.length?`onclick="choisir('${c.code}')"`:'disabled title="Bientôt"'}>${c.code}</button>`).join('');
  const c = COMPETENCES.find(x => x.code === actif);
  document.getElementById('contenu').innerHTML =
    `<section class="comp"><div class="comp-h"><div class="badge">${c.code}</div><div><h2>${esc(c.titre)}</h2>${c.sousTitre?`<p>${esc(c.sousTitre)}</p>`:''}</div>`+
    `<div class="outils"><button onclick="toutOuvrir(true)">Tout déplier</button><button onclick="toutOuvrir(false)">Tout replier</button></div></div>`+
    c.etapes.map((e,i) => `<details class="etape"><summary><span class="num">${i+1}</span><span class="etape-t">${esc(e.titre)}</span>${CHEV}</summary>`+
      `<div class="etape-c"><ul>${e.points.map(p=>`<li>${fort(p)}</li>`).join('')}</ul>${liensSimu(c.code, i + 1)}</div></details>`).join('')+
    ((c.alertes||[]).length||(c.astuces||[]).length ? `<div class="notes">`+
      (c.alertes||[]).map(a=>`<div class="alerte">${ALERTE}<span>${fort(a)}</span></div>`).join('')+
      ((c.astuces||[]).length ? `<div class="astuces">${c.astuces.map(a=>`<div class="astuce">${AMPOULE}<span>${fort(a)}</span></div>`).join('')}</div>` : '')+
    `</div>` : '')+
    `</section>`;
}
function choisir(code){ actif = code; try{ history.replaceState(null,'','#'+code.toLowerCase()); }catch(e){} afficher(); }
function toutOuvrir(o){ document.querySelectorAll('.etape').forEach(d => d.open = o); }
afficher();
if (etapeCible) { const d = document.querySelectorAll('.etape')[etapeCible-1];
  if (d) { d.open = true; d.classList.add('cible'); setTimeout(() => d.scrollIntoView({ block:'center' }), 60); } }

/* Thème : clair par défaut, sombre au choix (même réglage que Mes outils) */
const btn = document.getElementById('theme');
const SOLEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const LUNE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
function appliquer(s){ document.body.classList.toggle('dark', s); btn.innerHTML = s ? SOLEIL : LUNE; }
let choix = null; try { choix = localStorage.getItem('easy-hub-theme'); } catch(e){}
let sombre = choix === 'dark';
appliquer(sombre);
btn.addEventListener('click', () => { sombre = !sombre; appliquer(sombre); choix = sombre ? 'dark' : 'light'; try { localStorage.setItem('easy-hub-theme', choix); } catch(e){} });
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw-pedagogie.js', { scope: '/' }).catch(function () {}); });
}
</script>
<script>
/* Appli installée : « Mes outils » s'ouvre dans le navigateur, pas dans la fenêtre de l'appli */
if ((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone) {
  document.querySelectorAll('a[href="/"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
}
</script>
</body>
</html>
