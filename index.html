<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3131">
<title>Easy Auto-École · Mes outils</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Couleurs et polices (mêmes que Places Permis) ============ */
:root{
  --easy:#ff3131; --easy-dark:#e01f1f; --easy-light:#fff0f0;
  --grad-easy:linear-gradient(135deg,#ff4040 0%,#ff3131 55%,#ec1f1f 100%);
  --bg:#f7f6f5; --surface:#ffffff; --text:#1c2430; --text-muted:#6b7280; --text-light:#9ca3af;
  --border:#ebe9e7;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-hover:0 2px 4px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.10);
  --police-titre:'Fredoka','DM Sans',sans-serif;
  --police-texte:'DM Sans','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
body.dark{
  --bg:#0f1117; --surface:#1a1d27; --text:#e8eaf0; --text-muted:#8b92a8; --text-light:#5a6178;
  --border:#2a2f40; --easy-light:#3a0d0d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  --shadow-hover:0 2px 4px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column;
  font-family:var(--police-texte); background:var(--bg); color:var(--text);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  transition:background .3s var(--ease),color .3s var(--ease);
  -webkit-font-smoothing:antialiased;
}

/* ============ Bouton thème ============ */
.theme-btn{
  position:fixed; top:calc(16px + env(safe-area-inset-top)); right:16px; z-index:5;
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text-muted); cursor:pointer;
  display:grid; place-items:center;
  transition:color .2s var(--ease),border-color .2s var(--ease);
}
.theme-btn:hover{color:var(--easy); border-color:var(--easy)}
.theme-btn:focus-visible{outline:3px solid var(--easy); outline-offset:2px}
.theme-btn svg{width:18px;height:18px}

/* ============ Page ============ */
main{flex:1; width:100%; max-width:720px; margin:0 auto; padding:clamp(56px,11vh,110px) 20px 40px;
  display:flex; flex-direction:column; align-items:center}

.marque{display:flex; flex-direction:column; align-items:center}
.logo{display:block; width:clamp(150px,34vw,200px); height:auto; fill:var(--easy)}
.sourire{display:block; width:clamp(120px,26vw,160px); height:auto; margin-top:16px; fill:var(--easy);
  clip-path:inset(0 100% 0 0); animation:trace .7s var(--ease) .15s forwards}
@keyframes trace{to{clip-path:inset(0 0 0 0)}}

/* ============ Applis ============ */
.grille{list-style:none; width:100%; margin-top:48px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
.appli{
  position:relative; display:flex; align-items:center; gap:16px;
  padding:18px; border-radius:18px; background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow);
  text-decoration:none; color:inherit;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
}
a.appli:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:transparent}
a.appli:active{transform:scale(.98)}
.appli:focus-visible{outline:3px solid var(--easy); outline-offset:2px}
.icone{flex:none; width:52px; height:52px; border-radius:15px; background:var(--grad-easy); color:#fff;
  display:grid; place-items:center; box-shadow:0 4px 12px rgba(255,49,49,.28)}
.icone svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nom{font-family:var(--police-titre); font-weight:600; font-size:18px; line-height:1.2}
.fleche{margin-left:auto; width:18px; height:18px; flex:none; color:var(--text-light);
  fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
  transition:transform .2s var(--ease),color .2s var(--ease)}
a.appli:hover .fleche{transform:translateX(3px); color:var(--easy)}

/* Appli pas encore disponible */
.appli.a-venir{cursor:default; box-shadow:none; background:transparent; border-style:dashed}
.appli.a-venir .icone{background:var(--easy-light); color:var(--easy); box-shadow:none}
.appli.a-venir .nom{color:var(--text-muted)}
.pastille{margin-left:auto; flex:none; font-family:var(--police-titre); font-weight:600; font-size:12px;
  color:var(--easy); background:var(--easy-light); padding:3px 10px; border-radius:20px; white-space:nowrap}
.txt{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.txt .nom{overflow-wrap:anywhere}
.txt .pastille{margin-left:0}

.pied{text-align:center; padding:24px 20px 28px; font-size:12px; color:var(--text-light)}
.pied a{color:var(--text-muted); text-decoration:none}
.pied a:hover{color:var(--easy)}

@media (max-width:480px){
  .grille{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .sourire{animation:none; clip-path:none}
}
</style>
</head>

<script>
/* =====================================================================
   LISTE DES APPLIS — pour en ajouter une, copie un bloc et modifie-le.
   url   : adresse de l'appli ("" = pas encore disponible, carte grisée)
   icone : un nom de la liste ICONES plus bas
   badge : petit texte en pastille (ex. "Bêta"), sinon ""
   ===================================================================== */
const APPLIS = [
  {
    nom:   "Places Permis",
    url:   "https://easycds.github.io/permis/",
    icone: "calendrier",
    badge: ""
  },
  {
    nom:   "Simulateur",
    url:   "",                 // à remplir quand la bêta sera en ligne
    icone: "volant",
    badge: "Bêta · bientôt"
  },
  {
    nom:   "Pédagogie",
    url:   "https://easycds.github.io/pedagogie.html",
    icone: "livre",
    badge: ""
  },
  {
    nom:   "Administratif",
    url:   "https://easycds.github.io/administratif.html",
    icone: "cadenas",
    badge: "Accès réservé"
  },
];

/* Icônes style Lucide, comme sur Places Permis */
const ICONES = {
  calendrier:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  volant:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/><path d="M12 14v8M10 12H2.2M14 12h7.8"/>',
  livre:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  eleves:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  liste:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  stats:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  signature:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  code:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  route:'<path d="M4 22 8 2M20 22 16 2M12 4v3M12 11v3M12 18v3"/>',
  cadenas:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};

const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[n] || ICONES.liste}</svg>`;
const FLECHE = '<svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

document.getElementById('grille').innerHTML = APPLIS.map(a => {
  const pastille = a.badge ? `<span class="pastille">${a.badge}</span>` : '';
  return a.url
    ? `<li><a class="appli" href="${a.url}"><span class="icone">${svg(a.icone)}</span><span class="txt"><span class="nom">${a.nom}</span>${pastille}</span>${FLECHE}</a></li>`
    : `<li><span class="appli a-venir" aria-disabled="true"><span class="icone">${svg(a.icone)}</span><span class="txt"><span class="nom">${a.nom}</span>${pastille}</span></span></li>`;
}).join('');

/* Thème : clair par défaut, sombre seulement si on le choisit avec le bouton (choix mémorisé) */
const btn = document.getElementById('theme');
const SOLEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const LUNE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
function appliquer(sombre){
  document.body.classList.toggle('dark', sombre);
  btn.innerHTML = sombre ? SOLEIL : LUNE;
}
let choix = null;
try { choix = localStorage.getItem('easy-hub-theme'); } catch(e){}
let sombre = choix === 'dark';
appliquer(sombre);
btn.addEventListener('click', () => {
  sombre = !sombre; appliquer(sombre);
  choix = sombre ? 'dark' : 'light';
  try { localStorage.setItem('easy-hub-theme', choix); } catch(e){}
});
</script>
