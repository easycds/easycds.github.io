<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff3131">
<title>Easy · Écran d'accueil</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/fonts/polices.css">
<style>
:root{--easy:#ff3131;--easy-dark:#e01f1f;--rose:#ffe4e4;--text:#1c2430;--muted:#5f6672;--bg:#f4f3f1;--card:#fff;--border:#e6e3df}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(min(100vw, 177.78vh) / 120)} /* 1rem = 16 px sur un écran 1920 × 1080 */
html,body{height:100%;background:#000}
body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;color:var(--text);overflow:hidden;cursor:none;display:flex;align-items:center;justify-content:center}
.ecran{position:relative;width:120rem;height:67.5rem;background:var(--bg);overflow:hidden}
.f{font-family:'Fredoka','DM Sans',sans-serif;font-weight:600!important}

/* barre du haut, fixe */
.haut{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:2.6rem 4.5rem;transition:color .6s}
.logo{display:flex;align-items:baseline;gap:.6rem;font-weight:700}
.logo b{font-size:3rem;color:var(--easy);line-height:1;transition:color .6s}
.logo span{font-size:1.35rem}
.heure{text-align:right}
.heure b{display:block;font-weight:600;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.heure small{font-size:1.05rem;opacity:.7;text-transform:capitalize}
.ecran.sur-rouge .haut{color:#fff}
.ecran.sur-rouge .logo b{color:#fff}

/* fond rouge qui monte pour les diapos rouges */
.fond{position:absolute;inset:0;background:var(--easy);clip-path:circle(0% at 85% 15%);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1);z-index:0}
.ecran.sur-rouge .fond{clip-path:circle(150% at 85% 15%)}

/* diapos */
.diapo{position:absolute;inset:0;z-index:1;display:flex;align-items:center;gap:5rem;padding:9rem 6rem 6rem;visibility:hidden}
.diapo.on{visibility:visible}
.diapo .txt{flex:1;min-width:0}
.kick{font-size:1.5rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--easy);margin-bottom:1.2rem}
h2{font-weight:700;font-size:6rem;line-height:1;margin-bottom:1.8rem;text-wrap:balance}
h2 em{font-style:normal;color:var(--easy)}
.diapo p{font-size:2.6rem;line-height:1.35;color:#3a414d;max-width:56rem}
/* boîte auto : le parcours en 3 étapes */
.parcours{flex:none;width:50rem;display:flex;flex-direction:column;gap:1.6rem;position:relative}
.parcours::before{content:"";position:absolute;left:5.6rem;top:4rem;bottom:4rem;border-left:.5rem dashed var(--rose);z-index:0}
.parcours>div{position:relative;z-index:1;background:var(--card);border-radius:2.4rem;box-shadow:0 .6rem 2.4rem rgba(28,36,48,.1);display:flex;align-items:center;gap:2.4rem;padding:2rem 2.6rem}
.parcours i{flex:none;width:6rem;height:6rem;border-radius:1.8rem;background:var(--rose);color:var(--easy);display:grid;place-items:center;font-style:normal}
.parcours i svg{width:3.6rem;height:3.6rem}
.parcours b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:3rem;line-height:1.05}
.parcours small{display:block;font-size:1.9rem;color:var(--muted);margin-top:.4rem}
.parcours>div.fin{background:var(--easy);color:#fff}
.parcours>div.fin i{background:#fff}
.parcours>div.fin small{color:#fff;opacity:.9}
.diapo.on .parcours>div{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
.diapo.on .parcours>div:nth-child(2){animation-delay:.5s}.diapo.on .parcours>div:nth-child(3){animation-delay:1s}
.etapes-auto{display:flex;align-items:center;gap:.8rem;margin-top:3rem}
.etapes-auto>div{display:flex;align-items:center;gap:.9rem;background:var(--card);border-radius:1.6rem;box-shadow:0 .4rem 1.6rem rgba(28,36,48,.08);padding:.8rem 1.4rem .8rem .8rem;font-size:1.9rem;font-weight:700;white-space:nowrap}
.etapes-auto i{flex:none;width:4.4rem;height:4.4rem;border-radius:1.2rem;background:var(--rose);color:var(--easy);display:grid;place-items:center;font-style:normal;font-family:'Fredoka',sans-serif;font-weight:600;font-size:2.6rem}
.etapes-auto i svg{width:2.6rem;height:2.6rem}
.etapes-auto>div.fin{background:var(--easy);color:#fff}
.etapes-auto>div.fin i{background:#fff}
.etapes-auto>b{font-size:2.6rem;color:var(--easy)}
.voiture-auto{flex:none;width:60rem;margin-right:-3rem}
.voiture-auto img{width:100%;display:block}
.diapo.on .voiture-auto img{animation:roule 1.4s cubic-bezier(.2,.7,.2,1) both}
.gain{flex:none;width:60rem;background:var(--card);border-radius:3rem;box-shadow:0 .6rem 2.4rem rgba(28,36,48,.1);padding:3.4rem 3.6rem;display:flex;flex-direction:column;gap:3.2rem}
.gain h3{font-size:1.5rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gain .ligne b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:2.4rem;white-space:nowrap;margin-bottom:1.2rem}
.gain .ligne b em{font-style:normal;color:var(--easy)}
.gain .barre{position:relative;height:3.6rem;border-radius:1.2rem;background:var(--rose);overflow:hidden}
.gain .barre i{position:absolute;left:0;top:0;bottom:0;border-radius:1.2rem;background:var(--easy)}
.gain .barre s{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;justify-content:center;color:var(--easy);font-size:1.6rem;font-weight:700;text-decoration:none;background:repeating-linear-gradient(135deg,transparent 0 .8rem,rgba(255,49,49,.12) .8rem 1.6rem)}
.gain .ech{display:flex;justify-content:space-between;font-size:1.5rem;color:var(--muted);font-weight:600;margin-top:.6rem}
.diapo.on .gain .barre i{animation:pousse 1.2s .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes pousse{from{width:0!important}}
.badge12{display:inline-flex;align-items:center;gap:1.4rem;margin-top:3rem;background:var(--easy);color:#fff;border-radius:2rem;padding:1.2rem 2.2rem 1.2rem 1.2rem;font-size:2.2rem;font-weight:700}
.badge12 b{width:6rem;height:6rem;border-radius:50%;background:#fff;color:var(--easy);display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-size:3rem;line-height:1}
/* financement : les logos des aides */
.aides{flex:none;width:50rem;display:grid;grid-template-columns:1fr 1fr;gap:1.8rem}
.aides div{background:var(--card);border-radius:2.6rem;box-shadow:0 .6rem 2.4rem rgba(28,36,48,.1);display:flex;align-items:center;justify-content:center;padding:2.2rem;height:17rem}
.aides div.grand{grid-column:1/-1;height:26rem;padding:2.4rem}
.aides img{max-width:100%;max-height:100%}
.diapo.on .aides div{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
.diapo.on .aides div:nth-child(2){animation-delay:.25s}.diapo.on .aides div:nth-child(3){animation-delay:.4s}
@keyframes monte{from{opacity:0;transform:translateY(3rem) scale(.96)}to{opacity:1;transform:none}}
.illu{flex:none;width:44rem;height:38rem;background:var(--card);border-radius:3rem;box-shadow:0 .6rem 2.4rem rgba(28,36,48,.1);display:flex;align-items:center;justify-content:center;padding:2.4rem}
.illu img{max-width:100%;max-height:100%}
.illu.large{width:62rem;height:38rem;padding:1.6rem}   /* image très large (voiture) : carte plus large */
.illu.photo{width:66rem;height:37.2rem;padding:0;background:none;box-shadow:none;border-radius:0;margin-right:-5rem}
.illu.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.diapo.on .illu.photo img{animation:roule 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes roule{from{opacity:0;transform:translateX(8rem)}to{opacity:1;transform:none}}
.rouge h2,.rouge p,.rouge .kick{color:#fff}
.rouge h2 em{color:#fff}
.centre{flex-direction:column;justify-content:center;text-align:center;gap:2.5rem}
.centre h2{font-size:8rem;margin:0}
.sourire{width:24rem}

.liste{margin-top:2.4rem;display:flex;flex-direction:column;gap:1.1rem;max-width:56rem}
.liste div{background:var(--card);border-radius:1.4rem;padding:1.2rem 1.8rem;display:flex;justify-content:space-between;align-items:center;gap:2rem;font-size:2rem;font-weight:700;box-shadow:0 .2rem .8rem rgba(28,36,48,.06)}
.liste span{font-size:1.15rem;letter-spacing:.1em;padding:.45rem 1rem;border-radius:2rem;background:var(--rose);color:var(--easy-dark)}
.liste span.libre{background:#e6f4ec;color:#1f7a44}
.creneaux{display:flex;gap:1.6rem;margin-top:2.4rem}
.creneaux div{background:var(--easy);color:#fff;border-radius:1.6rem;padding:1.4rem 2rem;min-width:22rem}
.creneaux b{display:block;font-size:2.6rem}
.creneaux small{font-size:1.9rem}
.etapes{display:flex;flex-direction:column;gap:1.2rem;margin-top:2.2rem}
.etapes div{display:flex;align-items:center;gap:1.4rem;font-size:1.9rem}
.etapes i{font-style:normal;flex:none;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--easy);color:#fff;font-weight:700;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.qr{flex:none;width:30rem;background:var(--card);border-radius:3rem;padding:2.6rem;box-shadow:0 .6rem 2.4rem rgba(28,36,48,.1);text-align:center}
.qr svg{width:100%;height:auto;display:block}
.qr b{display:block;margin-top:1.4rem;font-size:1.6rem;color:var(--easy)}
.note{display:flex;gap:4rem;align-items:center}
.note .gros{font-size:12rem;font-weight:700;line-height:1}
.etoiles{font-size:3.4rem;letter-spacing:.3rem;color:#f5b400}
.av-b{flex-direction:column;justify-content:center;align-items:stretch;gap:0}
.av-b .tete{display:flex;align-items:flex-end;gap:2.6rem}
.av-b .tete b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:9.5rem;line-height:.85}
.av-b .tete .et{display:flex;gap:.4rem;line-height:1}
.av-b .tete .et span{font-size:4rem;color:#f5b400;opacity:0;transform:scale(.3) rotate(-30deg)}
.diapo.on .av-b .tete .et span,.diapo.on.av-b .tete .et span{animation:etoile .5s cubic-bezier(.3,1.7,.5,1) forwards}
.av-b .tete small{display:block;font-size:2rem;color:var(--muted);margin-top:.8rem;font-weight:600;line-height:1.4}
.av-b .verif{display:inline-flex;align-items:center;gap:.6rem;margin-left:1rem;color:#1f7a44;background:#e6f4ec;border-radius:2rem;padding:.3rem 1.2rem .3rem .9rem}
.av-b .verif::before{content:"✓";font-weight:800}
.bulles{display:grid;grid-template-columns:1fr 1fr;gap:2rem 4rem;margin-top:3rem;align-items:start}
.bulle{position:relative;background:var(--card);border-radius:2.4rem 2.4rem 2.4rem .6rem;padding:1.7rem 2.4rem;font-size:1.85rem;line-height:1.35;box-shadow:0 .8rem 2.6rem rgba(28,36,48,.1);opacity:0;transform:translateY(3rem) scale(.9)}
.diapo.on .bulle{animation:bulle .7s cubic-bezier(.3,1.5,.5,1) forwards}
.bulle:nth-child(2n){margin-top:2.6rem;margin-bottom:-2.6rem}
.bulle.d{border-radius:2.4rem 2.4rem .6rem 2.4rem;background:var(--easy);color:#fff}
.bulle small{display:flex;align-items:center;gap:.8rem;margin-top:1rem;font-size:1.5rem;font-weight:700;opacity:.85}
.bulle small i{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--rose);color:var(--easy);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.bulle.d small i{background:#fff}
@keyframes etoile{to{opacity:1;transform:none}}
@keyframes bulle{to{opacity:1;transform:none}}
.avis{display:flex;flex-direction:column;gap:1.4rem;flex:1;max-width:60rem}
.avis div{background:var(--card);border-radius:1.6rem;padding:1.6rem 2rem;font-size:1.8rem;font-style:italic;line-height:1.4;box-shadow:0 .2rem .8rem rgba(28,36,48,.06)}
.avis small{display:block;margin-top:.6rem;font-style:normal;font-weight:700;color:var(--easy);font-size:1.3rem}

/* animations d'entrée (déclenchées à chaque passage) */
.a{opacity:0;transform:translateY(2.4rem)}
.diapo.on .a{animation:monte .8s cubic-bezier(.2,.7,.2,1) forwards}
.diapo.on .a1{animation-delay:.15s}.diapo.on .a2{animation-delay:.3s}.diapo.on .a3{animation-delay:.45s}.diapo.on .a4{animation-delay:.6s}.diapo.on .a5{animation-delay:.75s}.diapo.on .a6{animation-delay:.9s}
.diapo.on .illu,.diapo.on .qr{animation:arrive 1s cubic-bezier(.2,.7,.2,1) .2s both}
.diapo.on .illu img{animation:flotte 6s ease-in-out 1.2s infinite}
.diapo.on .sourire{animation:sourit 1.2s cubic-bezier(.3,1.6,.5,1) .5s both}
.diapo.sort{visibility:visible;animation:sort .6s ease forwards}
@keyframes monte{to{opacity:1;transform:none}}
@keyframes arrive{from{opacity:0;transform:translateX(6rem) scale(.94)}to{opacity:1;transform:none}}
@keyframes flotte{50%{transform:translateY(-1rem)}}
@keyframes sourit{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
@keyframes sort{to{opacity:0;transform:translateY(-1.5rem)}}

/* barre de temps */
.temps{position:absolute;left:4.5rem;right:4.5rem;bottom:2.4rem;height:.35rem;border-radius:1rem;background:rgba(28,36,48,.08);z-index:5;overflow:hidden}
.temps i{display:block;height:100%;width:0;background:var(--easy);border-radius:1rem}
.ecran.sur-rouge .temps{background:rgba(255,255,255,.25)}
.ecran.sur-rouge .temps i{background:#fff}
.pied{position:absolute;right:4.5rem;bottom:3.4rem;z-index:5;font-size:1.15rem;color:var(--muted);transition:color .6s}
.ecran.sur-rouge .pied{color:#ffe4e4}

/* programme du jour, météo, annonces, reçus */
.compte{display:inline-block;margin-top:2.4rem;background:var(--easy);color:#fff;border-radius:1.8rem;padding:1.6rem 2.6rem;font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums}
.compte small{display:block;font-size:1.4rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:.4rem;font-family:'DM Sans',sans-serif}
.meteo-ico{display:flex;flex-direction:column;align-items:center;gap:1rem}
.meteo-ico svg{width:20rem;height:20rem}
.meteo-ico b{font-size:6rem;line-height:1;color:var(--text)}
.source-meteo{font-size:1.1rem;opacity:.5}
.mention-legale{font-size:1.15rem;line-height:1.4;opacity:.6;margin-top:2.4rem;max-width:46rem}
.annonce h2{font-size:6.6rem;max-width:96rem;margin:0 auto}
.annonce p{color:#fff!important;font-size:2.6rem;max-width:80rem;margin:0 auto}
.annonce .kick{color:#fff;opacity:.85}
.promo h2{font-size:7rem;max-width:96rem;margin:0 auto}
.promo .kick{color:#fff;opacity:.85}
.prix{display:inline-block;background:#fff;color:var(--easy);border-radius:2.4rem;padding:1.2rem 3.6rem;font-size:7rem;line-height:1}
.promo p{color:#fff!important;font-size:2.4rem;max-width:80rem;margin:0 auto}
.jusqua{font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.85}
.noms{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:2.2rem;max-width:60rem}
.noms span{background:#fff;color:var(--easy);border-radius:3rem;padding:.9rem 2rem;font-size:2.4rem;font-weight:600}
.deco{position:absolute;pointer-events:none;z-index:6}
.guirlande{position:absolute;left:0;right:0;top:0;height:3.4rem;z-index:6;display:flex;justify-content:space-around;align-items:flex-start;pointer-events:none}
.guirlande::before{content:"";position:absolute;left:0;right:0;top:-1.2rem;height:3rem;border-bottom:3px solid #2c3138;border-radius:0 0 50% 50%/0 0 100% 100%}
.guirlande i{width:1.3rem;height:2rem;border-radius:50% 50% 45% 45%;margin-top:1.3rem;background:currentColor;box-shadow:0 0 1.2rem currentColor;animation:brille 1.8s ease-in-out infinite}
.guirlande i:nth-child(2n){animation-delay:.9s}
@keyframes brille{50%{opacity:.45}}
@keyframes chute{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(180deg)}}
.flocon{position:absolute;top:0;opacity:.85;z-index:6;pointer-events:none;animation:chute 11s linear infinite}
@keyframes vole{50%{transform:translate(1.2rem,-.8rem) rotate(4deg)}}
.chauve{animation:vole 3s ease-in-out infinite}
.saison-ico svg{width:24rem;height:24rem}
@media (prefers-reduced-motion:reduce){.flocon,.chauve,.guirlande i{animation:none}}
@media (prefers-reduced-motion:reduce){.a,.diapo.on .a,.diapo.on .illu,.diapo.on .qr,.diapo.on .illu img,.diapo.on .sourire{animation:none;opacity:1;transform:none}.fond{transition:none}}
</style>
</head>
<body>
<div class="ecran" id="ecran">
  <div class="fond"></div>
  <div class="haut">
    <div class="logo f"><b>easy</b><span>auto-école</span></div>
    <div class="heure"><b class="f" id="h">--:--</b><small id="d"></small></div>
  </div>
  <div id="diapos"></div>
  <div class="pied">02 41 32 58 41</div>
  <div class="temps"><i id="t"></i></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   CONTENU DE L'ÉCRAN — c'est ici qu'on modifie les diapos.
   ===================================================================== */
var DUREE = 10;            // secondes par diapo
var IMG = 'img/';          // dossier des illustrations

// Stage code : les sessions passées disparaissent toutes seules
var STAGES = [
  {du:'2026-10-20', au:'2026-10-22', complet:true},
  {du:'2026-10-27', au:'2026-10-29', complet:true},
  {du:'2026-12-21', au:'2026-12-23', complet:true},
  {du:'2026-12-28', au:'2026-12-30', complet:true}
];

// Cours de code en salle (0 = dimanche … 3 = mercredi … 6 = samedi)
var COURS = [
  {jour:3, de:18, a:19, quand:'ce soir', heure:'18 h'},
  {jour:6, de:11, a:12, quand:'ce matin', heure:'11 h'}
];
// Météo de Saint-Sylvain-d'Anjou (Open-Meteo, gratuit, sans clé)
var METEO_URL = 'https://api.open-meteo.com/v1/forecast?latitude=47.507&longitude=-0.484&current=temperature_2m,weather_code&timezone=Europe%2FParis';
// Contenu modifiable depuis Administratif › Écran TV (Firebase)
var DONNEES_URL = 'https://firestore.googleapis.com/v1/projects/easy-cds/databases/(default)/documents/ecran_tv/config?key=AIzaSyBTlHPr02V0yTyyksUdQJhMgwwMBhns_9E';

var DIAPOS = [
  {type:'illu', img:'clio', photo:true, kick:'', titre:'Bienvenue <em>chez easy</em>', texte:'Ici, on apprend à conduire simplement.'},
  {type:'annonces'},   // annonces ajoutées dans Administratif › Écran TV
  {type:'promos'},     // promos du moment (Administratif › Écran TV), disparaissent après leur date de fin
  {type:'slogan', titre:'Avec easy, la conduite<br>c’est facile !'},
  {type:'programme'},  // mercredi et samedi : compte à rebours du cours de code
  {type:'meteo'},      // seulement s'il pleut, gèle, neige ou s'il y a du brouillard
  {type:'illu', img:'permis', kick:'Permis voiture', titre:'Passe ton <em>permis B</em>', texte:'Conduite classique, conduite accompagnée dès 15 ans, conduite supervisée.'},
  {type:'boite', kick:'Permis boîte automatique', titre:'Auto d’abord, <em>manuelle en 7&nbsp;h</em>', texte:'Plus de délai de 3 mois : la formation se fait juste après ton permis, sans repasser l’examen.'},
  {type:'illu', img:'moto', kick:'Deux-roues', titre:'Moto <em>&amp;</em> scooter', texte:'Permis AM, A1, A2, passerelle A2 vers A, formation 125.'},
  {type:'illu', img:'remorque', kick:'Remorque', titre:'Tracter <em>en sécurité</em>', texte:'Permis BE et formation B96.'},
  {type:'stages', kick:'Stage code · 129 € TTC hors formule', titre:'Le code <em>en 3 jours</em>', texte:'9 h – 12 h / 13 h – 17 h · Easy les Banchais'},
  {type:'creneaux', img:'salle', kick:'Cours de code', titre:'Rendez-vous <em>en salle</em>', creneaux:[['Mercredi','18 h – 19 h'],['Samedi','11 h – 12 h']]},

// ---- Contenu Administratif › Écran TV
var DONNEES=null, brut='';
function recevoir(j){                      // nouveau contenu : on le prend ; « Mettre à jour maintenant » recharge l'écran tout de suite
  if(!j||j===brut) return;
  var v; try{ v=JSON.parse(j); }catch(e){ return; }
  if(DONNEES && (v.recharger||0)!==(DONNEES.recharger||0)){ location.reload(); return; }
  brut=j; DONNEES=v; aRefaire=true; poserTheme();   // le décor change tout de suite, les diapos de saison au passage suivant
}
function ecouterDirect(){                  // en direct : chaque changement fait dans Administratif arrive en 1 à 2 secondes
  try{
    if(!window.firebase) return;
    var app=firebase.initializeApp({apiKey:'AIzaSyBTlHPr02V0yTyyksUdQJhMgwwMBhns_9E', projectId:'easy-cds'}, 'tv');
    app.firestore().collection('ecran_tv').doc('config').onSnapshot(function(s){ var d=s.exists&&s.data(); if(d&&d.json) recevoir(d.json); }, function(){});
  }catch(e){}
}
function majDonnees(){
  fetch(DONNEES_URL+'&t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(v){
    var j=v&&v.fields&&v.fields.json&&v.fields.json.stringValue;
    if(!j||j===brut) return;
    recevoir(j);
  }).catch(function(){});
}
function themeActif(){ return (DONNEES&&DONNEES.theme)||''; }
var themePose='';
function poserTheme(){                     // décor de saison par-dessus l'écran (aucun changement si le thème n'a pas bougé)
  var t=themeActif(); if(t===themePose) return; themePose=t;
  [].forEach.call(document.querySelectorAll('.saison-deco'), function(x){ x.remove(); });
  var e=document.getElementById('ecran');
  function add(html, style, cls){ var d=document.createElement('div'); d.className='deco saison-deco '+(cls||''); d.innerHTML=html; d.setAttribute('style',style); e.appendChild(d); return d; }
  if(t==='halloween'){
    add(S_TOILE,'right:0;top:0;width:16rem;opacity:.9');
    add(S_CHAUVE,'left:46%;top:7%;width:7rem','chauve'); add(S_CHAUVE,'left:56%;top:13%;width:4.5rem;animation-delay:-1s','chauve'); add(S_CHAUVE,'left:51%;top:3%;width:3.5rem;animation-delay:-2s','chauve');
    add(S_CITROUILLE,'left:4rem;bottom:5.5rem;width:9rem'); add(S_CITROUILLE,'left:12.5rem;bottom:5.5rem;width:6rem');
  } else if(t==='noel'){
    var g=add('','','guirlande'), cols=['#ff3131','#f2c200','#2f9e6b','#3b82c4'];
    for(var k=0;k<22;k++){ var b=document.createElement('i'); b.style.color=cols[k%4]; g.appendChild(b); }
    add(S_SAPIN,'left:3.5rem;bottom:5rem;width:9rem'); add(S_CADEAU,'left:12.5rem;bottom:5.4rem;width:5rem');
    for(var n=0;n<14;n++){ var fl=add(S_FLOCON,'left:'+(4+n*7)+'%;width:'+(1.6+(n%3)*0.8)+'rem;animation-delay:'+(-n*1.7)+'s','flocon'); }
  }
}
function promosActives(){
  var auj=ymd(new Date());
  return ((DONNEES&&DONNEES.promos)||[]).filter(function(x){ return x.titre && (!x.du||x.du<=auj) && (!x.au||x.au>=auj); });
}
function annoncesActives(){
  var auj=ymd(new Date());
  return ((DONNEES&&DONNEES.annonces)||[]).filter(function(x){ return x.titre && (!x.du||x.du<=auj) && (!x.au||x.au>=auj); });
}
function recusRecents(){
  var lim=ymd(new Date(Date.now()-30*864e5));
  return ((DONNEES&&DONNEES.recus)||[]).filter(function(x){ return x.prenom && (x.date||'')>=lim; })
    .sort(function(x,y){ return (y.date||'')<(x.date||'')?-1:1; }).slice(0,8).map(function(x){ return x.prenom; });
}

// ---- Diaporama
var zone=document.getElementById('diapos'), ecran=document.getElementById('ecran'), barre=document.getElementById('t'), els=[], i=-1, aRefaire=true, premier=true;
// Durée de chaque diapo : réglée dans Administratif › Écran TV (DONNEES.durees), sinon DUREE
function cleDuree(d){ return d.type+(d.img&&d.type!=='reçus'?':'+d.img:''); }
function dureeActuelle(){ var el=els[i], k=el&&el.getAttribute('data-t'), D=(typeof DONNEES!=='undefined'&&DONNEES&&DONNEES.durees)||{}, v=k?+D[k]:0; return v>=3&&v<=120?v:DUREE; }
function construire(){
  var liste=[];
  DIAPOS.forEach(function(d){
    if(d.type==='annonces') annoncesActives().forEach(function(x){ liste.push({type:'annonce', titre:x.titre, texte:x.texte}); });
    else if(d.type==='slogan' && SAISONS[themeActif()]){ liste.push(d); SAISONS[themeActif()].forEach(function(x){ liste.push(x); }); }
    else if(d.type==='promos') promosActives().forEach(function(x){ liste.push({type:'promo', titre:x.titre, prix:x.prix, texte:x.texte, au:x.au}); });
    else liste.push(d);
  });
  zone.innerHTML=liste.map(function(d){ return rendu(d).replace('<div class="diapo', '<div data-t="'+cleDuree(d)+'" class="diapo'); }).join(''); poserTheme();
  [].forEach.call(zone.querySelectorAll('.illu:not(.photo) img'), function(im){ var f=function(){ if(im.naturalWidth/im.naturalHeight>1.45 && !im.closest('.diapo').querySelector('.creneaux')) im.parentNode.classList.add('large'); }; if(im.complete) f(); else im.addEventListener('load', f); });
  els=[].slice.call(zone.querySelectorAll('.diapo'));
  majComptes(); aRefaire=false;
}
function suivante(){
  if(aRefaire || i+1>=els.length){ construire(); i=-1; }   // reconstruit à chaque tour (et dès qu'une info change)
  else if(i>=0){ var old=els[i]; old.classList.remove('on'); old.classList.add('sort'); setTimeout(function(){ old.classList.remove('sort'); },600); }
  i=i+1;
  var el=els[i];
  setTimeout(function(){
    el.classList.add('on');
    ecran.classList.toggle('sur-rouge', el.hasAttribute('data-rouge'));
    barre.style.transition='none'; barre.style.width='0';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ barre.style.transition='width '+dureeActuelle()+'s linear'; barre.style.width='100%'; }); });
  }, premier ? 0 : 350);
  premier=false;
}
majMeteo(); setInterval(majMeteo, 20*60000);
majDonnees(); setInterval(majDonnees, 60000); ecouterDirect();   // la lecture toutes les minutes reste en secours
setTimeout(function boucle(){ suivante(); setTimeout(boucle, dureeActuelle()*1000); }, 1500);   // chaque diapo a sa propre durée (réglable dans l'admin)   // laisse 1,5 s pour charger météo et annonces

// Note Codes Rousseau, mise à jour chaque semaine par GitHub (avis.json)
function majAvis(){ fetch('/avis.json?'+Date.now()).then(function(r){return r.json();}).then(function(v){ if(!v||!v.note) return; DIAPOS.forEach(function(d){ if(d.type==='avis'){ d.note=v.note; d.nb=v.nb+' avis'; } }); aRefaire=true; }).catch(function(){}); }
majAvis(); setInterval(majAvis, 6*3600000);
function horloge(){
  var n=new Date();
  document.getElementById('h').textContent=n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('d').textContent=n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
horloge(); setInterval(horloge,5000);

// Recharge la page chaque nuit pour récupérer les mises à jour
setInterval(function(){ var n=new Date(); if(n.getHours()===4 && n.getMinutes()<1) location.reload(); },50000);
// Plein écran au premier clic (sur un PC branché à la télé)
document.addEventListener('click',function(){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); });
// Garde l'écran allumé si le navigateur le permet
try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
</script>

<!-- ===== Écran de nuit : le sourire dort (de 18h30 à 8h00) ===== -->
<style>
#nuit{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse 60% 55% at 50% 52%,#121722 0%,#0b0e14 55%,#07090d 100%);display:none;overflow:hidden;cursor:none;font-family:'DM Sans',sans-serif;color:#5d6673}
#nuit.on{display:block}
#nuit.noir{background:#000;cursor:none}#nuit.noir>*{display:none}
#nuit .n-etoile{position:absolute;width:3px;height:3px;border-radius:50%;background:#8b94a3;opacity:0;animation:nScint 7s ease-in-out infinite}
@keyframes nScint{0%,100%{opacity:0}50%{opacity:.35}}
#nuit .n-scene{position:absolute;left:50%;top:50%;width:32vw;transform:translate(-50%,-75%);animation:nDerive 180s ease-in-out infinite alternate}
@keyframes nDerive{0%{margin-left:-2.2vw;margin-top:-1.4vh}50%{margin-left:1.8vw;margin-top:1.2vh}100%{margin-left:-.6vw;margin-top:2vh}}
#nuit .n-visage{position:relative;animation:nSouffle 6s ease-in-out infinite}
@keyframes nSouffle{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#nuit .n-sourire{width:100%;aspect-ratio:834/264;background:#5a1c1e;-webkit-mask:url(img/sourire_blanc.png) center/contain no-repeat;mask:url(img/sourire_blanc.png) center/contain no-repeat}
#nuit .n-z{position:absolute;right:-3vw;top:-4vw;font:600 3.2vw 'Fredoka',sans-serif;color:#4a5260;opacity:0;animation:nZ 6s ease-in infinite}
#nuit .n-z:nth-child(2){animation-delay:2s;font-size:2.4vw}#nuit .n-z:nth-child(3){animation-delay:4s;font-size:1.8vw}
@keyframes nZ{0%{opacity:0;transform:translate(0,0)}20%{opacity:.8}100%{opacity:0;transform:translate(4vw,-9vw)}}
#nuit .n-infos{position:absolute;left:0;right:0;bottom:7vh;text-align:center}
#nuit .n-heure{font:500 5.4vw 'Fredoka',sans-serif;color:#3d4450;letter-spacing:.04em}

</style>
<div id="nuit" aria-hidden="true">
  <div class="n-ciel"></div>
  <div class="n-scene"><div class="n-visage">
    <div class="n-sourire"></div>
  </div></div>
  <div class="n-infos"><div class="n-heure"></div><div class="n-msg"></div></div>
</div>
<script>
(function () {
  // Écran allumé (mode jour) selon les horaires de l'agence ; mode nuit le reste du temps ; noir complet de 1h à 6h.
  // [début, fin] en minutes depuis minuit, par jour (0 = dimanche … 6 = samedi)
  const EN_PLUS = [['2026-10-31', 13 * 60 + 30, 13 * 60 + 32]];   // allumages ponctuels [date, début, fin] (test du 31/10 : 13h30-13h32)
  const JOUR = { 1: [480, 1110], 2: [480, 1110], 3: [480, 1155], 4: [480, 1110], 5: [480, 1110], 6: [480, 780] };   // lun-ven 8h-18h30 (mercredi jusqu'à 19h15 pour le cours de code), samedi 8h-13h, dimanche fermé
  const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  const el = document.getElementById('nuit'), ciel = el.querySelector('.n-ciel');
  for (let i = 0; i < 38; i++) { const e = document.createElement('i'); e.className = 'n-etoile'; e.style.left = Math.random() * 100 + '%'; e.style.top = Math.random() * 62 + '%'; e.style.animationDelay = (-Math.random() * 7) + 's'; e.style.animationDuration = (5 + Math.random() * 6) + 's'; ciel.appendChild(e); }
  function maintenant() { const f = (location.hash.match(/nuit=(\d\d)(\d\d)/) || []), j = (location.hash.match(/jour=(\d)/) || []); const d = new Date(); if (f[1]) d.setHours(+f[1], +f[2], 0, 0); if (j[1]) d.setDate(d.getDate() + ((+j[1] - d.getDay() + 7) % 7)); return d; }
  function prochaine(d) { for (let k = 0; k < 8; k++) { const x = new Date(d); x.setDate(d.getDate() + k); x.setHours(13, 30, 0, 0); if ((x.getDay() === 1 || x.getDay() === 3) && x > d) return x; } }
  function maj() {
    const d = maintenant(), m = d.getHours() * 60 + d.getMinutes(), plage = JOUR[d.getDay()], jourIso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), extra = EN_PLUS.some(function (x) { return x[0] === jourIso && m >= x[1] && m < x[2]; }), nuit = !extra && (!plage || m < plage[0] || m >= plage[1]);
    el.classList.toggle('on', nuit); el.classList.toggle('noir', nuit); if (!nuit) return; // agence fermée : écran tout noir (la télé reste allumée sur la page)
    el.querySelector('.n-heure').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const p = prochaine(d), dem = new Date(d); dem.setDate(d.getDate() + 1);
    const quand = p.toDateString() === d.toDateString() ? "aujourd'hui" : p.toDateString() === dem.toDateString() ? 'demain' : JOURS[p.getDay()];
    el.querySelector('.n-msg').innerHTML = "L'agence est fermée · on se retrouve <b>" + quand + ' à 13h30</b>';
  }
  const im = new Image(); im.onload = () => { if (im.naturalWidth) el.querySelector('.n-sourire').style.aspectRatio = im.naturalWidth + '/' + im.naturalHeight; }; im.src = 'img/sourire_blanc.png';
  maj(); setInterval(maj, 20000);
})();
</script>
