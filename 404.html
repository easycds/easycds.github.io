<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable · Easy Saint-Sylvain</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/fonts/polices.css">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f0ef;color:#000000;font-family:'DM Sans',system-ui,sans-serif;padding:24px;text-align:center}
.box{max-width:460px}
.smile{width:150px;height:auto;margin:0 auto 10px;display:block}
.code{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;letter-spacing:.18em;color:#ff3131;text-transform:uppercase}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(30px,8vw,44px);line-height:1.1;margin:10px 0 0}
p{color:#5f6672;font-size:17px;margin:16px 0 0;line-height:1.5}
a.btn{display:inline-flex;align-items:center;height:54px;padding:0 28px;margin-top:30px;border-radius:27px;background:#ff3131;color:#fff;font-weight:700;font-size:16px;text-decoration:none}
a.btn:hover{background:#ff3131}
.pied{margin-top:40px;font-size:13px;color:#9aa1ab}
.pied b{font-family:'Fredoka',sans-serif;font-weight:600;color:#ff3131}
</style>
</head>
<body>
<main class="box">
  <!-- sourire Easy retourné : une petite moue -->
  <svg class="smile" viewBox="0 0 160 70" aria-hidden="true">
    <path d="M18 56 C45 20, 115 20, 142 56" fill="none" stroke="#ff3131" stroke-width="20" stroke-linecap="round"/>
  </svg>
  <div class="code">Erreur 404</div>
  <h1>Oups, cette page<br>n'existe pas</h1>
  <p>Le lien est peut-être cassé, ou la page a déménagé. On te ramène sur la bonne route.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
  <div class="pied"><b>easy</b> Saint-Sylvain-d'Anjou · 02 41 32 58 41</div>
</main>
</body>
</html>
